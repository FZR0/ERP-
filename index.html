<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="format-detection" content="telephone=no">
    <title>ERP 規劃師題庫</title>
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem("erp-theme");
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = savedTheme || (prefersDark ? "dark" : "light");
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">ERP 規劃師</p>
          <h1>題庫刷題</h1>
        </div>
        <div class="timer-box" aria-live="polite">
          <span>時間</span>
          <strong id="timer">00:00:00</strong>
        </div>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">
          深色
        </button>
      </header>

      <section id="start-screen" class="screen is-active">
        <div class="mode-grid" aria-label="刷題模式">
          <button class="mode-button" type="button" data-mode="normal">
            <span>普通</span>
            <strong>50 題</strong>
          </button>
          <button class="mode-button accent" type="button" data-mode="exam">
            <span>正式考試</span>
            <strong>70 題</strong>
          </button>
          <button class="mode-button" type="button" data-mode="all">
            <span>全部題庫</span>
            <strong id="all-count">載入中</strong>
          </button>
        </div>
        <p id="load-status" class="status-text">讀取題庫中</p>
      </section>

      <section id="quiz-screen" class="screen" aria-live="polite">
        <div class="quiz-topbar">
          <div>
            <span id="mode-label" class="pill">模式</span>
            <span id="progress-label" class="progress-text">第 1 / 1 題</span>
          </div>
          <button id="restart-from-quiz" class="ghost-button" type="button">重新開始</button>
        </div>

        <article class="question-panel">
          <div class="question-meta">
            <span id="source-label">題號</span>
            <span id="page-label">頁碼</span>
          </div>
          <h2 id="question-text"></h2>
          <div id="options" class="options"></div>
        </article>

        <div id="feedback" class="feedback" hidden></div>

        <div class="action-row">
          <button id="submit-answer" class="primary-button" type="button" disabled>發送答案</button>
          <button id="next-question" class="primary-button secondary" type="button" hidden>下一題</button>
        </div>
      </section>

      <section id="result-screen" class="screen">
        <div class="result-panel">
          <p class="eyebrow">完成</p>
          <h2 id="result-title">結果</h2>
          <div class="result-grid">
            <div>
              <span>答對</span>
              <strong id="score-label">0 / 0</strong>
            </div>
            <div>
              <span>正確率</span>
              <strong id="accuracy-label">0%</strong>
            </div>
            <div>
              <span>總耗時</span>
              <strong id="elapsed-label">00:00:00</strong>
            </div>
          </div>
          <button id="restart-from-result" class="primary-button" type="button">重新開始</button>
        </div>
      </section>
    </main>

    <script src="questions-data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
